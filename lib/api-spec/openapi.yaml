openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ChannelPulse - Reseller SOH & Sell-Through Monitoring API
servers:
  - url: /api
    description: Base API path
tags:
  - name: auth
  - name: health
  - name: dashboard
  - name: explorer
  - name: trends
  - name: alerts
  - name: uploads
  - name: resellers
  - name: parts
  - name: column-mappings

paths:
  /dashboard/serial-reconciliation:
    get:
      operationId: getSerialReconciliation
      tags: [dashboard]
      parameters:
        - { name: week_iso, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: part_ids, in: query, schema: { type: string, pattern: '^[1-9][0-9]*(,[1-9][0-9]*)*$' } }
        - { name: reseller_ids, in: query, schema: { type: string, pattern: '^[1-9][0-9]*(,[1-9][0-9]*)*$' } }
      responses:
        "200":
          description: Twelve weekly reseller/SKU reconciliations using committed sources only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SerialReconciliation" }
  /scanback/serials/{serial}:
    get:
      operationId: getSerialTrail
      tags: [scanback]
      parameters:
        - { name: serial, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Invoice, reported-sale and approved-claim trail with reuse flags
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanbackSerialTrail" }
  /scanback/programs/preview:
    post:
      operationId: previewProgramTable
      tags: [scanback]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgramTablePreviewInput" }
      responses:
        "200":
          description: Source-only program draft and reviewed mapping proposal; never saves a promotion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramTablePreview" }
  /upload-center:
    get:
      operationId: getUploadCenter
      tags: [uploads]
      responses:
        "200":
          description: Unified upload history and committed reference data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadCenterWorkspace" }
  /upload-center/files:
    post:
      operationId: stageCenterFiles
      tags: [uploads]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CenterFilesInput" }
      responses:
        "200":
          description: Previews only, never automatically committed
          content:
            application/json:
              schema:
                type: object
                required: [uploads, errors]
                properties:
                  uploads: { type: array, items: { $ref: "#/components/schemas/CenterUpload" } }
                  errors:
                    type: array
                    items:
                      type: object
                      required: [name, error]
                      properties:
                        name: { type: string }
                        error: { type: string }
  /upload-center/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: correctCenterUpload
      tags: [uploads]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CenterUploadCorrection" }
      responses:
        "200":
          description: Corrected preview; committed sources are immutable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CenterUpload" }
        "409": { description: Committed upload cannot be corrected }
    delete:
      operationId: deleteCenterUpload
      tags: [uploads]
      responses:
        "200":
          description: Pending preview removed
          content:
            application/json:
              schema: { type: object, properties: { success: { type: boolean } } }
        "409": { description: Committed upload cannot be deleted }
  /upload-center/{id}/commit:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: commitCenterReference
      tags: [uploads]
      responses:
        "200":
          description: Validated price list or program table committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CenterUpload" }
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      responses:
        "200":
          description: Current admin session state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
  /auth/login:
    post:
      operationId: loginAdmin
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLoginInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401":
          description: Invalid username or password
        "429":
          description: Too many attempts
  /auth/logout:
    post:
      operationId: logoutAdmin
      tags: [auth]
      responses:
        "200":
          description: Session cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
  /scanback/workspace:
    get:
      operationId: getScanbackWorkspace
      tags: [scanback]
      responses:
        "200":
          description: Saved scanback workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanbackWorkspace" }
  /scanback/programs:
    post:
      operationId: saveScanbackProgram
      tags: [scanback]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanbackProgramInput" }
      responses:
        "200":
          description: Saved program
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanbackProgram" }
  /scanback/imports/preview:
    post:
      operationId: previewScanbackImport
      tags: [scanback]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ScanbackUpload" }
      responses:
        "200":
          description: Preview only, not committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanbackImport" }
  /scanback/imports/{id}/remap:
    post:
      operationId: remapScanbackImport
      tags: [scanback]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanbackMapping" }
      responses:
        "200":
          description: Updated preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanbackImport" }
  /scanback/imports/{id}/commit:
    post:
      operationId: commitScanbackImport
      tags: [scanback]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Committed import
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanbackImport" }
  /scanback/imports/{id}/supersede:
    post:
      operationId: supersedeScanbackImport
      tags: [scanback]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Committed customer report marked superseded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanbackImport" }
  /scanback/pronto-credits/{importId}/{sourceRow}/resolve:
    post:
      operationId: resolveProntoCredit
      tags: [scanback]
      parameters:
        - { name: importId, in: path, required: true, schema: { type: string } }
        - { name: sourceRow, in: path, required: true, schema: { type: integer, minimum: 2 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProntoCreditResolutionInput" }
      responses:
        "200":
          description: Credit resolution appended to the audit history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProntoCreditResolution" }
        "400": { description: Invalid resolution or source credit }
        "409": { description: Credit is already resolved }
  /scanback/verify:
    post:
      operationId: verifyScanbackClaim
      tags: [scanback]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanbackVerificationInput" }
      responses:
        "200":
          description: Persisted verification draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanbackDraft" }
  /scanback/approve:
    post:
      operationId: approveScanbackClaim
      tags: [scanback]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanbackApprovalInput" }
      responses:
        "200":
          description: Immutable approved batch, not a payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanbackBatch" }
  /scanback/batches/{id}/export/{format}:
    get:
      operationId: exportScanbackBatch
      tags: [scanback]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: format, in: path, required: true, schema: { type: string, enum: [xlsx, csv] } }
      responses:
        "200":
          description: Approved statement from saved snapshot
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /scanback/drafts/{id}/export:
    get:
      operationId: exportScanbackDraft
      tags: [scanback]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Draft Excel statement, not approved
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Dashboard endpoints
  /dashboard/kpis:
    get:
      operationId: getDashboardKpis
      tags: [dashboard]
      summary: Get KPI cards and reseller reporting status for a given week
      parameters:
        - name: week_iso
          in: query
          schema:
            type: string
          description: ISO week string e.g. 2026-W27 (defaults to latest)
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Dashboard KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardKpis"

  /dashboard/heatmap:
    get:
      operationId: getDashboardHeatmap
      tags: [dashboard]
      summary: Get heatmap grid (parts x resellers, WOI values) for a given week
      parameters:
        - name: week_iso
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Heatmap data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatmapData"

  /dashboard/weekly-sales:
    get:
      operationId: getDashboardWeeklySales
      tags: [dashboard]
      summary: Weekly units sold by SKU for 12 consecutive ISO weeks, oldest first
      parameters:
        - name: week_iso
          in: query
          description: Final week of the 12-week window; defaults to the latest uploaded week
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: part_ids
          in: query
          schema:
            type: string
            pattern: '^[1-9][0-9]*(,[1-9][0-9]*)*$'
        - name: reseller_ids
          in: query
          schema:
            type: string
            pattern: '^[1-9][0-9]*(,[1-9][0-9]*)*$'
      responses:
        "200":
          description: Reported weekly sales, summed across selected accounts; absent cells represent missing data, not zero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklySalesData"
        "400":
          description: Invalid week or filter

  /dashboard/weeks:
    get:
      operationId: getAvailableWeeks
      tags: [dashboard]
      summary: Get list of available ISO weeks with data
      responses:
        "200":
          description: List of available weeks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeekSummary"

  # Explorer
  /explorer:
    get:
      operationId: getExplorerData
      tags: [explorer]
      summary: Get drill-down tree data (category -> model -> reseller)
      parameters:
        - name: week_iso
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: pivot
          in: query
          schema:
            type: string
            enum: [category_model_reseller, reseller_model, model_week]
          description: Pivot mode
      responses:
        "200":
          description: Explorer tree rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExplorerRow"

  /explorer/trend:
    get:
      operationId: getExplorerTrend
      tags: [explorer]
      summary: Get 12-week trend for a specific part+reseller or part or reseller
      parameters:
        - name: part_id
          in: query
          schema:
            type: ["integer", "null"]
        - name: reseller_id
          in: query
          schema:
            type: ["integer", "null"]
        - name: weeks
          in: query
          schema:
            type: integer
            default: 12
      responses:
        "200":
          description: Trend data points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendPoint"

  # Trends
  /trends:
    get:
      operationId: getTrends
      tags: [trends]
      summary: Get multi-week trend data for selected parts and resellers
      parameters:
        - name: part_ids
          in: query
          schema:
            type: string
          description: Comma-separated part IDs
        - name: reseller_ids
          in: query
          schema:
            type: string
          description: Comma-separated reseller IDs
        - name: weeks
          in: query
          schema:
            type: integer
            default: 12
        - name: metric
          in: query
          schema:
            type: string
            enum: [soh, st, woi]
            default: soh
      responses:
        "200":
          description: Trend series
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendSeries"

  # Alerts
  /alerts:
    get:
      operationId: getAlerts
      tags: [alerts]
      summary: Get auto-generated exception alerts for a week
      parameters:
        - name: week_iso
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Alert list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  # Uploads
  /uploads:
    get:
      operationId: getUploads
      tags: [uploads]
      summary: Get upload history
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Upload history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Upload"
    post:
      operationId: createUpload
      tags: [uploads]
      summary: Upload one or more reseller files (multipart/form-data)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadFilesInput"
      responses:
        "200":
          description: Per-file detection and review cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UploadReviewCard"

  /uploads/{id}/recheck:
    post:
      operationId: recheckUpload
      tags: [uploads]
      summary: Recheck a pending upload without changing analytics
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRecheckInput"
      responses:
        "200":
          description: Updated upload review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"

  /uploads/{id}:
    delete:
      operationId: deleteUpload
      tags: [uploads]
      summary: Delete an upload and roll back its inventory snapshots
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /uploads/{id}/commit:
    post:
      operationId: commitUpload
      tags: [uploads]
      summary: Commit a reviewed upload (confirm reseller, date, column mapping)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitUploadInput"
      responses:
        "200":
          description: Committed upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"

  /uploads/{id}/mapping:
    post:
      operationId: saveUploadMapping
      tags: [uploads]
      summary: Save confirmed column mapping for future use
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveMappingInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColumnMapping"

  # Resellers
  /resellers:
    get:
      operationId: getResellers
      tags: [resellers]
      summary: List all resellers
      responses:
        "200":
          description: Resellers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reseller"
    post:
      operationId: createReseller
      tags: [resellers]
      summary: Create a reseller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResellerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reseller"

  /resellers/{id}:
    patch:
      operationId: updateReseller
      tags: [resellers]
      summary: Update a reseller
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResellerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reseller"
    delete:
      operationId: deleteReseller
      tags: [resellers]
      summary: Delete a reseller
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  # Parts
  /parts:
    get:
      operationId: getParts
      tags: [parts]
      summary: List all parts
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: uncategorized
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Parts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Part"
    post:
      operationId: createPart
      tags: [parts]
      summary: Create a part
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Part"

  /parts/{id}:
    patch:
      operationId: updatePart
      tags: [parts]
      summary: Update a part (category, display name, active flag)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Part"

  # Column Mappings
  /column-mappings:
    get:
      operationId: getColumnMappings
      tags: [column-mappings]
      summary: List saved column mappings
      responses:
        "200":
          description: Column mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ColumnMapping"

  /column-mappings/{id}:
    delete:
      operationId: deleteColumnMapping
      tags: [column-mappings]
      summary: Delete a saved column mapping
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

components:
  schemas:
    AuthSession:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
    AdminLoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, enum: [admin] }
        password: { type: string, minLength: 1, maxLength: 256, writeOnly: true }
    ScanbackProgramLine:
      type: object
      required: [gtmBuyCents, caps]
      properties:
        sku: { type: string, minLength: 1, maxLength: 120 }
        partId: { type: [integer, "null"] }
        gtmBuyCents: { type: integer, minimum: 1 }
        rrpIncCents: { type: [integer, "null"], minimum: 0 }
        gtmIncCents: { type: [integer, "null"], minimum: 0 }
        ddCostExCents: { type: [integer, "null"], minimum: 0 }
        t1ExCents: { type: [integer, "null"], minimum: 0 }
        caps:
          type: array
          items: { $ref: "#/components/schemas/ScanbackCap" }
    ScanbackCap:
      type: object
      required: [resellerId, quantity]
      properties:
        resellerId: { type: integer }
        quantity: { type: [integer, "null"], minimum: 0 }
    ProgramTableMapping:
      type: object
      required: [fields, customers, ignored]
      properties:
        fields: { type: object, additionalProperties: { type: string } }
        customers: { type: object, additionalProperties: { type: [integer, "null"] } }
        ignored: { type: array, items: { type: string } }
    ProgramTablePreviewInput:
      type: object
      properties:
        text: { type: string, maxLength: 1000000 }
        uploadId: { type: string }
        mapping: { $ref: "#/components/schemas/ProgramTableMapping" }
        ai_assist: { type: boolean, default: true }
    ProgramTableRow:
      type: object
      required: [sourceRow, sku, rrpIncCents, gtmIncCents, ddCostExCents, t1ExCents, gtmBuyCents, caps]
      properties:
        sourceRow: { type: integer }
        sku: { type: string }
        rrpIncCents: { type: [integer, "null"] }
        gtmIncCents: { type: [integer, "null"] }
        ddCostExCents: { type: [integer, "null"] }
        t1ExCents: { type: [integer, "null"] }
        gtmBuyCents: { type: [integer, "null"] }
        caps: { type: array, items: { $ref: "#/components/schemas/ScanbackCap" } }
    ProgramTableIssue:
      type: object
      required: [row, column, message, blocking]
      properties:
        row: { type: [integer, "null"] }
        column: { type: string }
        message: { type: string }
        blocking: { type: boolean }
    ProgramTableIgnoredRow:
      type: object
      required: [row, reason]
      properties:
        row: { type: integer }
        reason: { type: string }
    ProgramTablePreview:
      type: object
      required: [headers, mapping, rows, customerIds, issues, sourceName, aiNote]
      properties:
